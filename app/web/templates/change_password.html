{% extends "base.html" %}
{% block title %}修改密码 - EhBot{% endblock %}
{% block content %}
<div class="form-page">
  <h1>修改密码</h1>
  <p>首次登录必须设置自己的管理员密码。</p>
  <form method="post" action="{{ url_for('change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <label for="current-password">当前密码</label>
    <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="new-password">新密码</label>
    <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirmation">确认新密码</label>
    <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" required>
    <button class="primary-button" type="submit">保存密码</button>
  </form>
</div>
{% endblock %}
