{% extends "base.html" %}
{% block title %}修改密码 - EhBot{% endblock %}
{% block content %}
<div class="form-page">
  <div class="page-heading"><div><span class="eyebrow">账户安全</span><h1>修改密码</h1><p>首次登录后必须设置自己的管理员密码</p></div></div>
  <form class="settings-form" method="post" action="{{ url_for('change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <div class="field-group"><label for="current-password">当前密码</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required></div>
    <div class="field-group"><label for="new-password">新密码</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" required><small>至少 12 个字符</small></div>
    <div class="field-group"><label for="confirmation">确认新密码</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" required></div>
    <div class="form-actions"><button class="primary-button" type="submit">保存密码</button></div>
  </form>
</div>
{% endblock %}
