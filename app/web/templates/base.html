<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EhBot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('dashboard') }}">
        <img src="{{ url_for('static', path='/ehbot-mark.svg') }}" alt="">
        <span>EhBot</span>
      </a>
      <nav class="primary-nav" aria-label="主导航">
        <a class="nav-link {% if request.url.path == url_for('dashboard').path %}is-active{% endif %}" href="{{ url_for('dashboard') }}">工作台</a>
        <a class="nav-link {% if request.url.path.startswith(url_for('candidate_queue').path) %}is-active{% endif %}" href="{{ url_for('candidate_queue') }}">候选队列</a>
        <a class="nav-link {% if request.url.path == url_for('sources_page').path %}is-active{% endif %}" href="{{ url_for('sources_page') }}">来源规则</a>
        <a class="nav-link {% if request.url.path == url_for('auto_approval_rules_page').path %}is-active{% endif %}" href="{{ url_for('auto_approval_rules_page') }}">自动审批</a>
        <a class="nav-link {% if request.url.path.startswith(url_for('archive_settings_page').path) %}is-active{% endif %}" href="{{ url_for('archive_settings_page') }}">归档设置</a>
        <a class="nav-link {% if request.url.path == url_for('connections_page').path %}is-active{% endif %}" href="{{ url_for('connections_page') }}">外部连接</a>
        <a class="nav-link {% if request.url.path == url_for('downloads_dashboard').path %}is-active{% endif %}" href="{{ url_for('downloads_dashboard') }}">下载任务</a>
      </nav>
      <div class="sidebar-footer">
        <a class="nav-link {% if request.url.path == url_for('change_password_page').path %}is-active{% endif %}" href="{{ url_for('change_password_page') }}">修改密码</a>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="nav-button" type="submit">退出登录</button>
        </form>
      </div>
    </aside>
    <div class="workspace">
      <header class="mobile-header">
        <a class="brand" href="{{ url_for('dashboard') }}">
          <img src="{{ url_for('static', path='/ehbot-mark.svg') }}" alt="">
          <span>EhBot</span>
        </a>
        <nav aria-label="移动端导航">
          <a href="{{ url_for('dashboard') }}">工作台</a>
          <a href="{{ url_for('candidate_queue') }}">候选</a>
          <a href="{{ url_for('sources_page') }}">来源</a>
          <a href="{{ url_for('auto_approval_rules_page') }}">审批</a>
          <a href="{{ url_for('archive_settings_page') }}">归档</a>
          <a href="{{ url_for('connections_page') }}">连接</a>
          <a href="{{ url_for('downloads_dashboard') }}">下载</a>
        </nav>
      </header>
      <main class="page-shell">{% block content %}{% endblock %}</main>
    </div>
  </div>
</body>
</html>
