services:
  ehbot:
    build: .
    init: true
    user: "${EHBOT_UID:-1000}:${EHBOT_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${EHBOT_PORT:-8080}:8080"
    environment:
      DATA_PATH: /app/data
      LIBRARY_PATH: /library
      WORK_PATH: /work
      APP_SECRET_KEY_FILE: /run/secrets/app_secret_key
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
      APP_ROOT_PATH: "${APP_ROOT_PATH:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    secrets:
      - app_secret_key
    volumes:
      - ./data:/app/data
      - "${LIBRARY_PATH:-./library}:/library"
      - "${WORK_PATH:-./work}:/work"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  app_secret_key:
    file: ./secrets/app_secret_key
