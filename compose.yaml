services:
  ehbot:
    build: .
    init: true
    user: "${EHBOT_UID:-1000}:${EHBOT_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${EHBOT_PORT:-8080}:8080"
    environment:
      DATA_PATH: /app/data
      LIBRARY_PATH: /library
      WORK_PATH: /work
      # Optional and normally left empty: the application generates and stores
      # its own session key on first start. Passed through so that a multi-replica
      # deployment can share one key by setting it in `.env`.
      APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
      APP_ROOT_PATH: "${APP_ROOT_PATH:-}"
      TAG_TRANSLATION_ENABLED: "${TAG_TRANSLATION_ENABLED:-true}"
      ARCHIVE_TOOLCHAIN_AUTO_INSTALL: "${ARCHIVE_TOOLCHAIN_AUTO_INSTALL:-true}"
      TELEGRAPH_ENABLED: "${TELEGRAPH_ENABLED:-true}"
      TELEGRAPH_CONCURRENCY: "${TELEGRAPH_CONCURRENCY:-3}"
      TELEGRAPH_MAX_IMAGES: "${TELEGRAPH_MAX_IMAGES:-400}"
      TELEGRAPH_MAX_IMAGE_BYTES: "${TELEGRAPH_MAX_IMAGE_BYTES:-20971520}"
      TELEGRAPH_MAX_TOTAL_BYTES: "${TELEGRAPH_MAX_TOTAL_BYTES:-1073741824}"
      TELEGRAPH_TIMEOUT_SECONDS: "${TELEGRAPH_TIMEOUT_SECONDS:-600}"
      TELEGRAPH_REQUIRE_FILECOUNT_MATCH: "${TELEGRAPH_REQUIRE_FILECOUNT_MATCH:-true}"
      TORRENT_ENABLED: "${TORRENT_ENABLED:-true}"
      TORRENT_POLL_SECONDS: "${TORRENT_POLL_SECONDS:-15}"
      TORRENT_CATEGORY: "${TORRENT_CATEGORY:-ehbot}"
      TORRENT_KEEP_SEEDING: "${TORRENT_KEEP_SEEDING:-true}"
      THUMBNAILS_ENABLED: "${THUMBNAILS_ENABLED:-true}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./data:/app/data
      - "${LIBRARY_PATH:-./library}:/library"
      - "${WORK_PATH:-./work}:/work"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
